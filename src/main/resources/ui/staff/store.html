<!doctype html>
<html class="light" lang="en">
<head>
  <meta charset="utf-8" />
  <meta content="width=device-width, initial-scale=1.0" name="viewport" />
  <title>Store Sales - Pawradise Spa</title>

  <link href="https://fonts.googleapis.com" rel="preconnect" />
  <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect" />
  <link
    href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
    rel="stylesheet"
  />

  <link rel="stylesheet" href="../assets/css/output.css" />
  <link rel="stylesheet" href="../assets/css/styles.css" />
  <link rel="stylesheet" href="../assets/css/admin-dashboard.css" />

  <style>
    .product-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 1rem;
    }

    .cart-panel {
      max-height: calc(100vh - 180px);
    }
  </style>
</head>
<body class="bg-background-light dark:bg-background-dark text-text-main dark:text-white transition-colors duration-200">
  <div class="flex h-screen w-full overflow-hidden">
    <aside
      id="sidebar"
      class="w-64 flex-shrink-0 border-r border-slate-200 dark:border-gray-800 bg-white dark:bg-surface-dark flex flex-col h-full z-20 transition-all duration-300"
    ></aside>

    <main class="flex-1 flex flex-col h-full overflow-hidden bg-background-light dark:bg-background-dark relative">
      <header
        id="header"
        class="flex-shrink-0 h-20 bg-white/80 dark:bg-surface-dark/80 backdrop-blur-md border-b border-slate-200 dark:border-gray-800 flex items-center justify-between px-8 z-10 sticky top-0"
      ></header>

      <div class="flex-1 overflow-y-auto p-8 scroll-smooth">
        <div class="max-w-[1400px] mx-auto flex flex-col gap-6">
          <div class="flex flex-col md:flex-row md:items-end md:justify-between gap-4">
            <div>
              <h1 class="text-3xl font-bold text-text-main dark:text-white tracking-tight">Store Sales</h1>
              <p class="text-text-muted mt-1 font-medium">Add products to cart, review receipt, then confirm billing.</p>
            </div>
            <div class="flex items-center gap-3">
              <button
                id="clearCartBtn"
                class="px-5 py-2.5 border border-slate-200 dark:border-gray-700 rounded-xl text-sm font-semibold text-text-main dark:text-white hover:bg-slate-50 dark:hover:bg-gray-800 transition-all"
              >
                Clear Cart
              </button>
              <button
                id="refreshProductsBtn"
                class="px-5 py-2.5 bg-primary text-white rounded-xl font-semibold text-sm hover:bg-primary-content transition-colors shadow-lg shadow-primary/30"
              >
                Refresh Products
              </button>
            </div>
          </div>

          <div class="grid grid-cols-1 xl:grid-cols-[minmax(0,1fr)_360px] gap-6">
            <section class="bg-surface-light dark:bg-surface-dark rounded-2xl shadow-card border border-slate-200/50 dark:border-gray-800 p-5 space-y-4">
              <div class="grid grid-cols-1 md:grid-cols-[minmax(0,1fr)_220px] gap-3">
                <input
                  id="productSearchInput"
                  type="text"
                  placeholder="Search products by name, category, or product code"
                  class="w-full px-4 py-2.5 bg-slate-100 dark:bg-gray-800 border-none rounded-xl text-sm focus:ring-2 focus:ring-primary/50 text-text-main dark:text-white"
                />
                <select
                  id="categoryFilter"
                  class="w-full px-4 py-2.5 bg-slate-100 dark:bg-gray-800 border-none rounded-xl text-sm focus:ring-2 focus:ring-primary/50 text-text-main dark:text-white"
                >
                  <option value="">All Categories</option>
                </select>
              </div>

              <div id="productGrid" class="product-grid"></div>
              <p id="productsEmptyState" class="hidden text-sm text-text-muted">No products found.</p>
            </section>

            <aside class="bg-surface-light dark:bg-surface-dark rounded-2xl shadow-card border border-slate-200/50 dark:border-gray-800 flex flex-col cart-panel">
              <div class="p-5 border-b border-slate-200 dark:border-gray-800">
                <h2 class="text-lg font-bold text-text-main dark:text-white">Active Billing</h2>
                <p class="text-xs text-text-muted mt-1">Cash checkout with receipt preview</p>
              </div>

              <div id="cartItems" class="flex-1 overflow-y-auto p-5 space-y-3"></div>
              <p id="cartEmptyState" class="p-5 text-sm text-text-muted">Cart is empty. Add products to start checkout.</p>

              <div class="p-5 border-t border-slate-200 dark:border-gray-800 space-y-3 bg-slate-50 dark:bg-gray-900/30 rounded-b-2xl">
                <div class="grid grid-cols-2 gap-3">
                  <div>
                    <label for="salesCustomerSelect" class="block text-xs font-semibold uppercase tracking-wide text-text-muted mb-1">Customer</label>
                    <select
                      id="salesCustomerSelect"
                      class="w-full px-3 py-2 bg-white dark:bg-gray-800 border border-slate-200 dark:border-gray-700 rounded-lg text-sm"
                    >
                      <option value="">Walk-in Customer</option>
                    </select>
                  </div>
                  <div>
                    <label for="discountInput" class="block text-xs font-semibold uppercase tracking-wide text-text-muted mb-1">Discount</label>
                    <div class="relative">
                      <input
                        id="discountInput"
                        type="number"
                        min="1"
                        max="99"
                        step="1"
                        value=""
                        placeholder="0-99"
                        class="w-full px-3 py-2 bg-white dark:bg-gray-800 border border-slate-200 dark:border-gray-700 rounded-lg text-sm"
                        style="padding-right: 2rem;"
                      />
                      <span
                        class="pointer-events-none text-sm text-text-muted"
                        style="position: absolute; right: 0.75rem; top: 50%; transform: translateY(-50%);"
                      >&#37;</span>
                    </div>
                  </div>
                </div>

                <div>
                  <label for="salesNoteInput" class="block text-xs font-semibold uppercase tracking-wide text-text-muted mb-1">Note</label>
                  <textarea
                    id="salesNoteInput"
                    rows="2"
                    placeholder="Optional checkout note"
                    class="w-full px-3 py-2 bg-white dark:bg-gray-800 border border-slate-200 dark:border-gray-700 rounded-lg text-sm resize-none"
                  ></textarea>
                </div>

                <div class="space-y-1 text-sm">
                  <div class="flex items-center justify-between">
                    <span class="text-text-muted">Subtotal</span>
                    <span id="subtotalValue" class="font-semibold text-text-main dark:text-white">0</span>
                  </div>
                  <div class="flex items-center justify-between">
                    <span id="discountSummaryLabel" class="text-text-muted">Discount</span>
                    <span id="discountValue" class="font-semibold text-text-main dark:text-white">0</span>
                  </div>
                  <div class="flex items-center justify-between pt-2 border-t border-slate-200 dark:border-gray-700">
                    <span class="font-bold text-text-main dark:text-white">Total</span>
                    <span id="totalValue" class="text-xl font-extrabold text-primary">0</span>
                  </div>
                </div>

                <button
                  id="checkoutBtn"
                  class="w-full bg-primary text-white py-3 rounded-xl font-bold text-sm hover:bg-primary-content transition-all active:scale-[0.98]"
                >
                  Review & Confirm
                </button>
              </div>
            </aside>
          </div>
        </div>

        <div class="h-10"></div>
      </div>
    </main>
  </div>

  <div id="modalContainer" class="hidden fixed inset-0 z-50 flex items-center justify-center p-4">
    <div class="absolute inset-0 bg-black/40 backdrop-blur-sm" onclick="closeModal()"></div>
    <div class="relative bg-white dark:bg-surface-dark rounded-2xl shadow-2xl w-full max-w-3xl max-h-[90vh] overflow-y-auto">
      <div class="flex items-center justify-between p-6 border-b border-slate-200 dark:border-gray-800">
        <h3 id="modalTitle" class="text-lg font-bold text-text-main dark:text-white"></h3>
        <button onclick="closeModal()" class="size-8 flex items-center justify-center rounded-full hover:bg-slate-100 dark:hover:bg-gray-800 transition-colors text-text-muted">
          <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M6 18 18 6M6 6l12 12" />
          </svg>
        </button>
      </div>
      <div id="modalBody" class="p-6"></div>
    </div>
  </div>

  <script src="../assets/js/common.js"></script>
  <script src="../assets/js/staff/store.js"></script>
</body>
</html>
