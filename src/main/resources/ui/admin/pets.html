<!doctype html>
<html class="light" lang="en">
  <head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Manage Pets - Pawradise Spa</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com" rel="preconnect" />
    <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect" />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <!-- CSS Files -->
    <link rel="stylesheet" href="../assets/css/output.css" />
    <link rel="stylesheet" href="../assets/css/styles.css" />
    <link rel="stylesheet" href="../assets/css/admin-dashboard.css" />
  </head>
  <body
    class="bg-background-light dark:bg-background-dark text-text-main dark:text-white transition-colors duration-200"
  >
    <div class="flex h-screen w-full overflow-hidden">

      <!-- Sidebar (loaded dynamically) -->
      <aside
        id="sidebar"
        class="w-64 flex-shrink-0 border-r border-slate-200 dark:border-gray-800 bg-white dark:bg-surface-dark flex flex-col h-full z-20 transition-all duration-300"
      ></aside>

      <!-- Main Content -->
      <main
        class="flex-1 flex flex-col h-full overflow-hidden bg-background-light dark:bg-background-dark relative"
      >
        <!-- Header (loaded dynamically) -->
        <header
          id="header"
          class="flex-shrink-0 h-20 bg-white/80 dark:bg-surface-dark/80 backdrop-blur-md border-b border-slate-200 dark:border-gray-800 flex items-center justify-between px-8 z-10 sticky top-0"
        ></header>

        <!-- Page Content -->
        <div class="flex-1 overflow-y-auto p-8 scroll-smooth">
          <div class="max-w-[1400px] mx-auto flex flex-col gap-8">

            <!-- Page Header -->
            <div class="flex flex-col md:flex-row justify-between items-start md:items-end gap-4">
              <div>
                <h1 class="text-3xl font-bold text-text-main dark:text-white tracking-tight">
                  Manage Pets
                </h1>
                <p class="text-text-muted mt-1 font-medium">
                  View and manage the details of all registered pet clients.
                </p>
              </div>
              <div class="flex gap-3">
                <button
                  id="registerPetBtn"
                  class="flex items-center gap-2 px-5 py-2.5 bg-primary text-white rounded-xl font-semibold text-sm hover:bg-primary-content transition-colors shadow-lg shadow-primary/30"
                >
                  <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15" />
                  </svg>
                  Register New Pet
                </button>
              </div>
            </div>

            <!-- Total Count -->
            <div class="flex items-center justify-between mb-[-24px]">
              <div
                id="totalPetsCount"
                class="text-sm font-semibold text-text-muted bg-surface-light dark:bg-surface-dark px-4 py-2 rounded-lg border border-slate-200/50 dark:border-gray-800"
              >
                Total Pets: 0
              </div>
            </div>

            <!-- Pets Table -->
            <div class="bg-surface-light dark:bg-surface-dark rounded-2xl shadow-card border border-slate-200/50 dark:border-gray-800 overflow-hidden">
              <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                  <thead>
                    <tr class="text-text-muted text-xs uppercase tracking-wider bg-slate-50 dark:bg-gray-800/30">
                      <th class="px-6 py-5 font-semibold">Pet Name</th>
                      <th class="px-6 py-5 font-semibold">Owner</th>
                      <th class="px-6 py-5 font-semibold">Species</th>
                      <th class="px-6 py-5 font-semibold">Breed</th>
                      <th class="px-6 py-5 font-semibold">
                        <button class="flex items-center gap-1 hover:text-primary transition-colors uppercase tracking-wider font-semibold">
                          Age
                          <svg class="w-4 h-4" viewBox="0 0 24 24" fill="currentColor">
                            <path d="M7 10l5-5 5 5H7zm0 4h10l-5 5-5-5z"/>
                          </svg>
                        </button>
                      </th>
                      <th class="px-6 py-5 font-semibold text-right">Action</th>
                    </tr>
                  </thead>
                  <tbody id="petsTableBody" class="divide-y divide-slate-100 dark:divide-gray-800">
                    <!-- Pets loaded dynamically -->
                  </tbody>
                </table>
              </div>

              <!-- Empty State -->
              <div id="emptyState" class="hidden p-12 text-center">
                <svg class="w-16 h-16 mx-auto text-slate-300 dark:text-gray-600 mb-4" viewBox="0 0 1024 1024" fill="currentColor">
                  <path d="M792.5 558.4c-46.8-27-44-118.7-14-170.7 26.9-46.6 86.5-62.6 133.1-35.7s62.6 86.5 35.7 133.1c-30.1 52.1-108 100.4-154.8 73.3zM623.4 390c-60.7-16.3-86.1-124.4-67.4-194 16.5-61.5 79.7-98.1 141.3-81.6 61.5 16.5 98.1 79.7 81.6 141.3-18.7 69.6-94.8 150.6-155.5 134.3zM233.5 558.7c-46.9 27.1-125.1-21.3-155.2-73.4-27-46.7-11-106.4 35.8-133.4 46.7-27 106.5-11 133.4 35.7 30 52.2 32.9 144-14 171.1zM374.6 390c-60.7 16.3-136.8-64.7-155.4-134.3-16.5-61.5 20-124.8 81.6-141.3S425.6 134.4 442.1 196c18.6 69.6-6.8 177.7-67.5 194zM513 436.3c111.7 0 279.9 170.1 279.9 307.6 0 91.3-28.3 143.3-79.1 161.4-17.5 6.2-32 7.4-54.3 6.7-4.4-0.1-5.2-0.2-6.5-0.2-11.7 0-23.4-3.8-39.7-11.2-5.4-2.5-11.1-5.3-19.2-9.4 5.8 2.9-15.2-7.7-20.1-10.1-16.3-8.1-28.8-13.7-40.5-17.8-9-3.2-17.2-5.3-24.5-6.3h8c-7.3 1.1-15.4 3.2-24.5 6.4-11.8 4.2-24.2 9.7-40.5 17.9-4.9 2.4-25.8 13.1-20.1 10.2-8.1 4.1-13.8 6.9-19.2 9.4-16.2 7.5-28 11.3-39.7 11.3-1.3 0-2.1 0-6.5 0.2-22.3 0.7-36.8-0.5-54.3-6.7-50.8-18.1-79.1-70.1-79.1-161.4 0-137.5 168.2-308 279.9-308z"/>
                </svg>
                <h3 class="text-lg font-bold text-text-main dark:text-white mb-2">No pets found</h3>
                <p class="text-text-muted mb-4">Get started by registering the first pet.</p>
              </div>

              <!-- Pagination -->
              <div id="paginationBar" class="hidden flex items-center justify-between px-6 py-6 border-t border-slate-200 dark:border-gray-800">
                <div id="pageInfo" class="text-sm text-text-muted font-medium">
                  Showing 1 to 10 of 0 entries
                </div>
                <div class="flex items-center gap-2">
                  <button
                    id="prevPageBtn"
                    class="size-10 flex items-center justify-center rounded-full border border-slate-200 dark:border-gray-700 text-text-muted hover:bg-slate-100 dark:hover:bg-gray-800 transition-colors"
                  >
                    <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                      <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 19.5 8.25 12l7.5-7.5" />
                    </svg>
                  </button>
                  <div id="pageNumbers" class="flex items-center gap-1">
                    <!-- Page numbers rendered by JS -->
                  </div>
                  <button
                    id="nextPageBtn"
                    class="size-10 flex items-center justify-center rounded-full border border-slate-200 dark:border-gray-700 text-text-muted hover:bg-slate-100 dark:hover:bg-gray-800 transition-colors"
                  >
                    <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                      <path stroke-linecap="round" stroke-linejoin="round" d="m8.25 4.5 7.5 7.5-7.5 7.5" />
                    </svg>
                  </button>
                </div>
              </div>
            </div>
          </div>

          <!-- Spacer -->
          <div class="h-10"></div>
        </div>
      </main>
    </div>

    <!-- Pet Modal -->
    <div
      id="petModal"
      class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden"
    >
      <div class="bg-white dark:bg-surface-dark rounded-2xl shadow-xl w-full max-w-lg">
        <div class="flex items-center justify-between p-6 border-b border-slate-200 dark:border-gray-800">
          <h3 id="petModalTitle" class="text-lg font-bold text-text-main dark:text-white">
            Register New Pet
          </h3>
          <button
            id="closeModalBtn"
            class="text-text-muted hover:text-text-main dark:hover:text-white transition-colors"
          >
            <svg class="w-6 h-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M6 18 18 6M6 6l12 12" />
            </svg>
          </button>
        </div>
        <form id="petForm" class="p-6 space-y-4">
          <input type="hidden" id="petId" />

          <!-- Owner -->
          <div>
            <label class="block text-sm font-medium text-text-main dark:text-white mb-2">Owner (Customer)</label>
            <select
              id="petOwnerSelect"
              class="w-full px-4 py-2.5 bg-slate-100 dark:bg-gray-800 border-none rounded-xl text-sm focus:ring-2 focus:ring-primary/50 text-text-main dark:text-white"
              required
            >
              <option value="">Select owner...</option>
            </select>
          </div>

          <!-- Pet Name + Species -->
          <div class="grid grid-cols-2 gap-4">
            <div>
              <label class="block text-sm font-medium text-text-main dark:text-white mb-2">Pet Name</label>
              <input
                type="text"
                id="petName"
                class="w-full px-4 py-2.5 bg-slate-100 dark:bg-gray-800 border-none rounded-xl text-sm focus:ring-2 focus:ring-primary/50 text-text-main dark:text-white"
                placeholder="e.g. Buddy"
                required
              />
            </div>
            <div>
              <label class="block text-sm font-medium text-text-main dark:text-white mb-2">Species</label>
              <select
                id="petSpecies"
                class="w-full px-4 py-2.5 bg-slate-100 dark:bg-gray-800 border-none rounded-xl text-sm focus:ring-2 focus:ring-primary/50 text-text-main dark:text-white"
              >
                <option value="Dog">Dog</option>
                <option value="Cat">Cat</option>
                <option value="Bird">Bird</option>
                <option value="Rabbit">Rabbit</option>
                <option value="Other">Other</option>
              </select>
            </div>
          </div>

          <!-- Breed + Age -->
          <div class="grid grid-cols-2 gap-4">
            <div>
              <label class="block text-sm font-medium text-text-main dark:text-white mb-2">Breed</label>
              <input
                type="text"
                id="petBreed"
                class="w-full px-4 py-2.5 bg-slate-100 dark:bg-gray-800 border-none rounded-xl text-sm focus:ring-2 focus:ring-primary/50 text-text-main dark:text-white"
                placeholder="e.g. Golden Retriever"
              />
            </div>
            <div>
              <label class="block text-sm font-medium text-text-main dark:text-white mb-2">Age (years)</label>
              <input
                type="number"
                id="petAge"
                min="0"
                class="w-full px-4 py-2.5 bg-slate-100 dark:bg-gray-800 border-none rounded-xl text-sm focus:ring-2 focus:ring-primary/50 text-text-main dark:text-white"
                placeholder="0"
              />
            </div>
          </div>

          <!-- Weight -->
          <div>
            <label class="block text-sm font-medium text-text-main dark:text-white mb-2">Weight (kg)</label>
            <input
              type="number"
              id="petWeight"
              min="0"
              step="0.1"
              class="w-full px-4 py-2.5 bg-slate-100 dark:bg-gray-800 border-none rounded-xl text-sm focus:ring-2 focus:ring-primary/50 text-text-main dark:text-white"
              placeholder="0.0"
            />
          </div>

          <!-- Notes -->
          <div>
            <label class="block text-sm font-medium text-text-main dark:text-white mb-2">Health Notes</label>
            <textarea
              id="petNotes"
              rows="3"
              class="w-full px-4 py-2.5 bg-slate-100 dark:bg-gray-800 border-none rounded-xl text-sm focus:ring-2 focus:ring-primary/50 text-text-main dark:text-white resize-none"
              placeholder="Any allergies, medical conditions, or special care instructions..."
            ></textarea>
          </div>

          <!-- Buttons -->
          <div class="flex justify-end gap-3 pt-2">
            <button
              type="button"
              id="cancelModalBtn"
              class="px-5 py-2.5 bg-slate-100 dark:bg-gray-700 text-text-main dark:text-white rounded-xl font-semibold text-sm hover:bg-slate-200 dark:hover:bg-gray-600 transition-colors"
            >
              Cancel
            </button>
            <button
              type="submit"
              class="px-5 py-2.5 bg-primary text-white rounded-xl font-semibold text-sm hover:bg-primary-content transition-colors"
            >
              Save Pet
            </button>
          </div>
        </form>
      </div>
    </div>

    <!-- JavaScript -->
    <script src="../assets/js/common.js"></script>
    <script src="../assets/js/admin/pets.js"></script>
  </body>
</html>
