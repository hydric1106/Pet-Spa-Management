<!doctype html>
<html class="light" lang="en">
<head>
  <meta charset="utf-8" />
  <meta content="width=device-width, initial-scale=1.0" name="viewport" />
  <title>Billing History - Pawradise Spa</title>

  <link href="https://fonts.googleapis.com" rel="preconnect" />
  <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect" />
  <link
    href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
    rel="stylesheet"
  />

  <link rel="stylesheet" href="../assets/css/output.css" />
  <link rel="stylesheet" href="../assets/css/styles.css" />
  <link rel="stylesheet" href="../assets/css/admin-dashboard.css" />
</head>
<body class="bg-background-light dark:bg-background-dark text-text-main dark:text-white transition-colors duration-200">
  <div class="flex h-screen w-full overflow-hidden">
    <aside
      id="sidebar"
      class="w-64 flex-shrink-0 border-r border-slate-200 dark:border-gray-800 bg-white dark:bg-surface-dark flex flex-col h-full z-20 transition-all duration-300"
    ></aside>

    <main class="flex-1 flex flex-col h-full overflow-hidden bg-background-light dark:bg-background-dark relative">
      <header
        id="header"
        class="flex-shrink-0 h-20 bg-white/80 dark:bg-surface-dark/80 backdrop-blur-md border-b border-slate-200 dark:border-gray-800 flex items-center justify-between px-8 z-10 sticky top-0"
      ></header>

      <div class="flex-1 overflow-y-auto p-8 scroll-smooth">
        <div class="max-w-[1400px] mx-auto flex flex-col gap-6">
          <div>
            <h1 class="text-3xl font-bold text-text-main dark:text-white tracking-tight">Billing History</h1>
            <p class="text-text-muted mt-1 font-medium">Review confirmed sales receipts by date.</p>
          </div>

          <section class="bg-surface-light dark:bg-surface-dark rounded-2xl shadow-card border border-slate-200/50 dark:border-gray-800 p-5">
            <div class="flex flex-col md:flex-row md:items-end gap-3 md:justify-between">
              <div class="flex flex-col sm:flex-row gap-3 sm:items-end">
                <div>
                  <label for="billingDateFilter" class="block text-xs font-semibold uppercase tracking-wide text-text-muted mb-1">Billing Date</label>
                  <input
                    id="billingDateFilter"
                    type="date"
                    class="px-3 py-2 bg-white dark:bg-gray-800 border border-slate-200 dark:border-gray-700 rounded-lg text-sm"
                  />
                </div>
                <button
                  id="refreshBillingBtn"
                  class="px-5 py-2.5 bg-primary text-white rounded-xl font-semibold text-sm hover:bg-primary-content transition-colors shadow-lg shadow-primary/30"
                >
                  Refresh
                </button>
              </div>

              <p class="text-sm text-text-muted" id="billingCountText">0 receipts</p>
            </div>

            <div class="mt-5 overflow-x-auto border border-slate-200 dark:border-gray-800 rounded-xl">
              <table class="min-w-full">
                <thead class="bg-slate-50 dark:bg-gray-800/50">
                  <tr>
                    <th class="py-3 px-4 text-left text-xs font-bold uppercase tracking-wide text-slate-500">Receipt No</th>
                    <th class="py-3 px-4 text-left text-xs font-bold uppercase tracking-wide text-slate-500">Cashier / Customer</th>
                    <th class="py-3 px-4 text-right text-xs font-bold uppercase tracking-wide text-slate-500">Amount</th>
                    <th class="py-3 px-4 text-left text-xs font-bold uppercase tracking-wide text-slate-500">Payment</th>
                    <th class="py-3 px-4 text-left text-xs font-bold uppercase tracking-wide text-slate-500">Sold At</th>
                    <th class="py-3 px-4 text-right text-xs font-bold uppercase tracking-wide text-slate-500">Action</th>
                  </tr>
                </thead>
                <tbody id="billingHistoryBody" class="divide-y divide-slate-100 dark:divide-gray-800"></tbody>
              </table>
            </div>

            <p id="billingHistoryEmptyState" class="hidden mt-4 text-sm text-text-muted">No receipts found for selected date.</p>
          </section>
        </div>
      </div>
    </main>
  </div>

  <div id="modalContainer" class="hidden fixed inset-0 z-50 flex items-center justify-center p-4">
    <div class="absolute inset-0 bg-black/40 backdrop-blur-sm" onclick="closeModal()"></div>
    <div class="relative bg-white dark:bg-surface-dark rounded-2xl shadow-2xl w-full max-w-3xl max-h-[90vh] overflow-y-auto">
      <div class="flex items-center justify-between p-6 border-b border-slate-200 dark:border-gray-800">
        <h3 id="modalTitle" class="text-lg font-bold text-text-main dark:text-white"></h3>
        <button onclick="closeModal()" class="size-8 flex items-center justify-center rounded-full hover:bg-slate-100 dark:hover:bg-gray-800 transition-colors text-text-muted">
          <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M6 18 18 6M6 6l12 12" />
          </svg>
        </button>
      </div>
      <div id="modalBody" class="p-6"></div>
    </div>
  </div>

  <script src="../assets/js/common.js"></script>
  <script src="../assets/js/admin/billing-history.js"></script>
</body>
</html>
