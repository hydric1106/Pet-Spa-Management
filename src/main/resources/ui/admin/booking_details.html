<!doctype html>
<html class="light" lang="en">
  <head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Booking Details - Pawradise Spa</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com" rel="preconnect" />
    <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect" />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <!-- CSS Files -->
    <link rel="stylesheet" href="../assets/css/output.css" />
    <link rel="stylesheet" href="../assets/css/styles.css" />
    <link rel="stylesheet" href="../assets/css/admin-dashboard.css" />
  </head>
  <body
    class="bg-background-light dark:bg-background-dark text-text-main dark:text-white transition-colors duration-200"
  >
    <div class="flex h-screen w-full overflow-hidden">

      <!-- Sidebar (loaded dynamically) -->
      <aside
        id="sidebar"
        class="w-64 flex-shrink-0 border-r border-slate-200 dark:border-gray-800 bg-white dark:bg-surface-dark flex flex-col h-full z-20 transition-all duration-300"
      ></aside>

      <!-- Main Content -->
      <main
        class="flex-1 flex flex-col h-full overflow-hidden bg-background-light dark:bg-background-dark relative"
      >
        <!-- Custom Header with Back button on left, search + user on right -->
        <header
          class="flex-shrink-0 h-20 bg-white/80 dark:bg-surface-dark/80 backdrop-blur-md border-b border-slate-200 dark:border-gray-800 flex items-center justify-between px-8 z-10 sticky top-0"
        >
          <!-- Back Button -->
          <button
            id="backBtn"
            class="flex items-center gap-2 text-text-muted hover:text-primary transition-colors font-medium"
          >
            <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M10.5 19.5 3 12m0 0 7.5-7.5M3 12h18" />
            </svg>
            <span>Back to Schedule</span>
          </button>

          <!-- Right: Search + User -->
          <div class="flex items-center gap-6">
            <div class="relative hidden md:block">
              <svg
                class="absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 w-5 h-5"
                viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                stroke-linecap="round" stroke-linejoin="round"
              >
                <circle cx="11" cy="11" r="8" /><path d="m21 21-4.3-4.3" />
              </svg>
              <input
                id="searchInput"
                class="pl-10 pr-4 py-2.5 bg-slate-100 dark:bg-gray-800 border-none rounded-xl text-sm focus:ring-2 focus:ring-primary/50 w-64 placeholder:text-slate-400 text-text-main dark:text-white transition-all"
                placeholder="Search appointments..."
                type="text"
              />
            </div>
            <div class="flex items-center gap-3 pl-3 border-l border-slate-200 dark:border-gray-700">
              <div class="text-right hidden lg:block">
                <p id="currentUserName" class="text-sm font-bold text-text-main dark:text-white">â€”</p>
                <p class="text-xs text-text-muted">Admin</p>
              </div>
              <div
                id="userAvatar"
                class="size-10 rounded-full bg-primary/10 flex items-center justify-center text-primary font-bold border-2 border-white dark:border-gray-700 shadow-sm cursor-pointer hover:ring-2 hover:ring-primary transition-all"
              >
                <svg class="w-5 h-5" viewBox="0 0 24 24" fill="currentColor">
                  <path d="M12 12c2.7 0 4.8-2.1 4.8-4.8S14.7 2.4 12 2.4 7.2 4.5 7.2 7.2 9.3 12 12 12zm0 2.4c-3.2 0-9.6 1.6-9.6 4.8v2.4h19.2v-2.4c0-3.2-6.4-4.8-9.6-4.8z"/>
                </svg>
              </div>
            </div>
          </div>
        </header>

        <!-- Page Content -->
        <div class="flex-1 overflow-y-auto p-8 scroll-smooth">
          <div class="max-w-4xl mx-auto flex flex-col gap-8">

            <!-- Page Title Row -->
            <div class="flex justify-between items-center">
              <h1 class="text-3xl font-bold text-text-main dark:text-white tracking-tight">
                Booking Details
              </h1>
              <span
                id="bookingIdBadge"
                class="px-4 py-1.5 rounded-full bg-primary/10 text-primary-content text-sm font-bold border border-primary/20"
              >
                â€”
              </span>
            </div>

            <!-- Pet Info Card -->
            <div class="bg-surface-light dark:bg-surface-dark rounded-2xl shadow-card p-6 border border-slate-200/50 dark:border-gray-800">
              <div class="flex items-center gap-6">
                <!-- Pet Avatar -->
                <div
                  id="petAvatar"
                  class="size-24 rounded-full border-4 border-slate-100 dark:border-gray-700 bg-primary/10 flex items-center justify-center shadow-lg flex-shrink-0"
                >
                  <svg class="w-10 h-10 text-primary" viewBox="0 0 1024 1024" fill="currentColor">
                    <path d="M792.5 558.4c-46.8-27-44-118.7-14-170.7 26.9-46.6 86.5-62.6 133.1-35.7s62.6 86.5 35.7 133.1c-30.1 52.1-108 100.4-154.8 73.3zM623.4 390c-60.7-16.3-86.1-124.4-67.4-194 16.5-61.5 79.7-98.1 141.3-81.6 61.5 16.5 98.1 79.7 81.6 141.3-18.7 69.6-94.8 150.6-155.5 134.3zM233.5 558.7c-46.9 27.1-125.1-21.3-155.2-73.4-27-46.7-11-106.4 35.8-133.4 46.7-27 106.5-11 133.4 35.7 30 52.2 32.9 144-14 171.1zM374.6 390c-60.7 16.3-136.8-64.7-155.4-134.3-16.5-61.5 20-124.8 81.6-141.3S425.6 134.4 442.1 196c18.6 69.6-6.8 177.7-67.5 194zM513 436.3c111.7 0 279.9 170.1 279.9 307.6 0 91.3-28.3 143.3-79.1 161.4-17.5 6.2-32 7.4-54.3 6.7-4.4-0.1-5.2-0.2-6.5-0.2-11.7 0-23.4-3.8-39.7-11.2-5.4-2.5-11.1-5.3-19.2-9.4 5.8 2.9-15.2-7.7-20.1-10.1-16.3-8.1-28.8-13.7-40.5-17.8-9-3.2-17.2-5.3-24.5-6.3h8c-7.3 1.1-15.4 3.2-24.5 6.4-11.8 4.2-24.2 9.7-40.5 17.9-4.9 2.4-25.8 13.1-20.1 10.2-8.1 4.1-13.8 6.9-19.2 9.4-16.2 7.5-28 11.3-39.7 11.3-1.3 0-2.1 0-6.5 0.2-22.3 0.7-36.8-0.5-54.3-6.7-50.8-18.1-79.1-70.1-79.1-161.4 0-137.5 168.2-308 279.9-308z"/>
                  </svg>
                </div>
                <!-- Pet Info -->
                <div class="flex-1">
                  <h2 id="petName" class="text-2xl font-bold text-text-main dark:text-white">â€”</h2>
                  <p id="petBreed" class="text-text-muted font-medium mt-0.5">â€”</p>
                  <div class="mt-2 flex items-center gap-2">
                    <svg class="w-4 h-4 text-text-muted" viewBox="0 0 24 24" fill="currentColor">
                      <path d="M12 12c2.7 0 4.8-2.1 4.8-4.8S14.7 2.4 12 2.4 7.2 4.5 7.2 7.2 9.3 12 12 12zm0 2.4c-3.2 0-9.6 1.6-9.6 4.8v2.4h19.2v-2.4c0-3.2-6.4-4.8-9.6-4.8z"/>
                    </svg>
                    <span id="petOwner" class="text-sm font-medium text-text-main dark:text-gray-300">â€”</span>
                  </div>
                </div>
                <!-- Action Buttons -->
                <div class="flex gap-2">
                  <button
                    id="viewContactBtn"
                    class="p-2.5 rounded-xl bg-slate-100 dark:bg-gray-800 text-text-muted hover:bg-primary/10 hover:text-primary transition-colors"
                    title="View contact"
                  >
                    <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                      <path stroke-linecap="round" stroke-linejoin="round" d="M15 9h3.75M15 12h3.75M15 15h3.75M4.5 19.5h15a2.25 2.25 0 0 0 2.25-2.25V6.75A2.25 2.25 0 0 0 19.5 4.5h-15a2.25 2.25 0 0 0-2.25 2.25v10.5A2.25 2.25 0 0 0 4.5 19.5ZM8.25 8.625a1.125 1.125 0 1 1-2.25 0 1.125 1.125 0 0 1 2.25 0Zm-1.125 3.75a4.125 4.125 0 0 1-2.119-.584.75.75 0 1 0-.769 1.285A5.63 5.63 0 0 0 7.125 13.5c.972 0 1.882-.27 2.663-.74a.75.75 0 1 0-.776-1.28 4.125 4.125 0 0 1-1.887.495Z" />
                    </svg>
                  </button>
                  <button
                    id="viewHistoryBtn"
                    class="p-2.5 rounded-xl bg-slate-100 dark:bg-gray-800 text-text-muted hover:bg-primary/10 hover:text-primary transition-colors"
                    title="View history"
                  >
                    <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                      <path stroke-linecap="round" stroke-linejoin="round" d="M12 6v6h4.5m4.5 0a9 9 0 1 1-18 0 9 9 0 0 1 18 0Z" />
                    </svg>
                  </button>
                </div>
              </div>
            </div>

            <!-- Appointment Info Card -->
            <div class="bg-surface-light dark:bg-surface-dark rounded-2xl shadow-card border border-slate-200/50 dark:border-gray-800 overflow-hidden">
              <div class="p-6 border-b border-slate-200 dark:border-gray-800">
                <h3 class="text-lg font-bold text-text-main dark:text-white">Appointment Information</h3>
              </div>

              <div class="p-8 grid grid-cols-1 md:grid-cols-2 gap-x-12 gap-y-8">

                <!-- Date & Time -->
                <div class="space-y-2">
                  <label class="text-xs font-bold text-text-muted uppercase tracking-wider">Date &amp; Time</label>
                  <div class="relative">
                    <svg class="absolute left-3 top-1/2 -translate-y-1/2 text-primary w-5 h-5" viewBox="0 0 24 24" fill="currentColor">
                      <path d="M19 4h-1V2h-2v2H8V2H6v2H5c-1.11 0-1.99.9-1.99 2L3 20c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 16H5V9h14v11zM9 11H7v2h2v-2zm4 0h-2v2h2v-2zm4 0h-2v2h2v-2zm-8 4H7v2h2v-2zm4 0h-2v2h2v-2zm4 0h-2v2h2v-2z"/>
                    </svg>
                    <input
                      id="bookingDateTime"
                      class="w-full pl-10 pr-4 py-3 bg-slate-50 dark:bg-gray-800 border border-slate-200 dark:border-gray-700 rounded-xl text-text-main dark:text-white focus:ring-2 focus:ring-primary/50 focus:border-transparent transition-all"
                      type="text"
                      readonly
                    />
                  </div>
                </div>

                <!-- Service -->
                <div class="space-y-2">
                  <label class="text-xs font-bold text-text-muted uppercase tracking-wider">Service</label>
                  <div class="relative">
                    <svg class="absolute left-3 top-1/2 -translate-y-1/2 text-primary w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                      <path stroke-linecap="round" stroke-linejoin="round" d="M9.75 3.104v5.714a2.25 2.25 0 0 1-.659 1.591L5 14.5M9.75 3.104c-.251.023-.501.05-.75.082m.75-.082a24.301 24.301 0 0 1 4.5 0m0 0v5.714c0 .597.237 1.17.659 1.591L19.8 15.3M14.25 3.104c.251.023.501.05.75.082M19.8 15.3l-1.57.393A9.065 9.065 0 0 1 12 15a9.065 9.065 0 0 1-6.23-.693L5 14.5m14.8.8 1.402 1.402c1.232 1.232.65 3.318-1.067 3.611A48.309 48.309 0 0 1 12 21c-2.773 0-5.491-.235-8.135-.687-1.718-.293-2.3-2.379-1.067-3.61L5 14.5" />
                    </svg>
                    <select
                      id="serviceSelect"
                      class="w-full pl-10 pr-4 py-3 bg-slate-50 dark:bg-gray-800 border border-slate-200 dark:border-gray-700 rounded-xl text-text-main dark:text-white focus:ring-2 focus:ring-primary/50 focus:border-transparent transition-all appearance-none"
                    >
                      <option value="">Select service...</option>
                    </select>
                  </div>
                </div>

                <!-- Staff Assigned -->
                <div class="space-y-2">
                  <label class="text-xs font-bold text-text-muted uppercase tracking-wider">Staff Assigned</label>
                  <div class="relative">
                    <svg class="absolute left-3 top-1/2 -translate-y-1/2 text-primary w-5 h-5" viewBox="0 0 32 32" fill="currentColor">
                      <path d="M29,9H3c-0.6,0-1,0.4-1,1v16c0,0.6,0.4,1,1,1h26c0.6,0,1-0.4,1-1V10C30,9.4,29.6,9,29,9z M15,23H7c-0.6,0-1-0.4-1-1c0-1.9,1-3.5,2.5-4.3C8.2,17.2,8,16.6,8,16c0-1.7,1.3-3,3-3s3,1.3,3,3c0,0.6-0.2,1.2-0.5,1.7C15,18.5,16,20.1,16,22C16,22.6,15.6,23,15,23z M25,21h-3c-0.6,0-1-0.4-1-1s0.4-1,1-1h3c0.6,0,1,0.4,1,1S25.6,21,25,21z M25,17h-6c-0.6,0-1-0.4-1-1s0.4-1,1-1h6c0.6,0,1,0.4,1,1S25.6,17,25,17z"/>
                      <path d="M20,11h-8c-0.6,0-1-0.4-1-1V9c0-2.8,2.2-5,5-5s5,2.2,5,5v1C21,10.6,20.6,11,20,11z M13,9h6c0-1.7-1.3-3-3-3S13,7.3,13,9z"/>
                    </svg>
                    <select
                      id="staffSelect"
                      class="w-full pl-10 pr-4 py-3 bg-slate-50 dark:bg-gray-800 border border-slate-200 dark:border-gray-700 rounded-xl text-text-main dark:text-white focus:ring-2 focus:ring-primary/50 focus:border-transparent transition-all appearance-none"
                    >
                      <option value="">Select staff...</option>
                    </select>
                  </div>
                </div>

                <!-- Status -->
                <div class="space-y-2">
                  <label class="text-xs font-bold text-text-muted uppercase tracking-wider">Status</label>
                  <div class="relative">
                    <svg class="absolute left-3 top-1/2 -translate-y-1/2 text-primary w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                      <path stroke-linecap="round" stroke-linejoin="round" d="m11.25 11.25.041-.02a.75.75 0 0 1 1.063.852l-.708 2.836a.75.75 0 0 0 1.063.853l.041-.021M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0Zm-9-3.75h.008v.008H12V8.25Z" />
                    </svg>
                    <select
                      id="statusSelect"
                      class="w-full pl-10 pr-4 py-3 bg-slate-50 dark:bg-gray-800 border border-slate-200 dark:border-gray-700 rounded-xl text-text-main dark:text-white focus:ring-2 focus:ring-primary/50 focus:border-transparent transition-all appearance-none font-semibold"
                    >
                      <option value="PENDING">Pending</option>
                      <option value="CONFIRMED">Confirmed</option>
                      <option value="IN_PROGRESS">In Progress</option>
                      <option value="COMPLETED">Completed</option>
                      <option value="CANCELLED">Cancelled</option>
                    </select>
                  </div>
                </div>

                <!-- Special Instructions -->
                <div class="md:col-span-2 space-y-2">
                  <label class="text-xs font-bold text-text-muted uppercase tracking-wider">Special Instructions</label>
                  <textarea
                    id="specialInstructions"
                    class="w-full px-4 py-3 bg-slate-50 dark:bg-gray-800 border border-slate-200 dark:border-gray-700 rounded-xl text-text-main dark:text-white focus:ring-2 focus:ring-primary/50 focus:border-transparent transition-all resize-none"
                    placeholder="Add any special grooming requests..."
                    rows="3"
                  ></textarea>
                </div>

                <!-- Pet Health Notes -->
                <div class="md:col-span-2 space-y-2">
                  <label class="text-xs font-bold text-text-muted uppercase tracking-wider">Pet Health Notes</label>
                  <div
                    id="healthNotesBox"
                    class="p-4 bg-orange-50 dark:bg-orange-900/10 border border-orange-100 dark:border-orange-800/30 rounded-xl flex items-start gap-3"
                  >
                    <svg class="w-5 h-5 text-orange-500 mt-0.5 flex-shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                      <path stroke-linecap="round" stroke-linejoin="round" d="M21 8.25c0-2.485-2.099-4.5-4.688-4.5-1.935 0-3.597 1.126-4.312 2.733-.715-1.607-2.377-2.733-4.313-2.733C5.1 3.75 3 5.765 3 8.25c0 7.22 9 12 9 12s9-4.78 9-12Z" />
                    </svg>
                    <p id="healthNotesText" class="text-sm text-orange-800 dark:text-orange-400">
                      No health notes on file.
                    </p>
                  </div>
                </div>

                <!-- Estimated Duration -->
                <div class="space-y-2">
                  <label class="text-xs font-bold text-text-muted uppercase tracking-wider">Estimated Duration</label>
                  <div class="relative">
                    <svg class="absolute left-3 top-1/2 -translate-y-1/2 text-primary w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                      <path stroke-linecap="round" stroke-linejoin="round" d="M12 6v6h4.5m4.5 0a9 9 0 1 1-18 0 9 9 0 0 1 18 0Z" />
                    </svg>
                    <input
                      id="estimatedDuration"
                      class="w-full pl-10 pr-4 py-3 bg-slate-50 dark:bg-gray-800 border border-slate-200 dark:border-gray-700 rounded-xl text-text-main dark:text-white focus:ring-2 focus:ring-primary/50 focus:border-transparent transition-all"
                      type="text"
                      placeholder="e.g. 90 minutes"
                    />
                  </div>
                </div>

                <!-- Total Price -->
                <div class="space-y-2">
                  <label class="text-xs font-bold text-text-muted uppercase tracking-wider">Total Price</label>
                  <div class="relative">
                    <svg class="absolute left-3 top-1/2 -translate-y-1/2 text-primary w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                      <path stroke-linecap="round" stroke-linejoin="round" d="M2.25 18.75a60.07 60.07 0 0 1 15.797 2.101c.727.198 1.453-.342 1.453-1.096V18.75M3.75 4.5v.75A.75.75 0 0 1 3 6h-.75m0 0v-.375c0-.621.504-1.125 1.125-1.125H20.25M2.25 6v9m18-10.5v.75c0 .414.336.75.75.75h.75m-1.5-1.5h.375c.621 0 1.125.504 1.125 1.125v9.75c0 .621-.504 1.125-1.125 1.125h-.375m1.5-1.5H21a.75.75 0 0 0-.75.75v.75m0 0H3.75m0 0h-.375a1.125 1.125 0 0 1-1.125-1.125V15m1.5 1.5v-.75A.75.75 0 0 0 3 15h-.75M15 10.5a3 3 0 1 1-6 0 3 3 0 0 1 6 0Zm3 0h.008v.008H18V10.5Zm-12 0h.008v.008H6V10.5Z" />
                    </svg>
                    <input
                      id="totalPrice"
                      class="w-full pl-10 pr-4 py-3 bg-slate-50 dark:bg-gray-800 border border-slate-200 dark:border-gray-700 rounded-xl text-text-main dark:text-white focus:ring-2 focus:ring-primary/50 focus:border-transparent transition-all font-semibold"
                      type="text"
                      placeholder="$0.00"
                    />
                  </div>
                </div>

              </div>

              <!-- Action Buttons -->
              <div class="p-8 bg-slate-50/50 dark:bg-gray-800/50 flex flex-col md:flex-row gap-4 border-t border-slate-200 dark:border-gray-800">
                <button
                  id="updateBookingBtn"
                  class="flex-1 flex items-center justify-center gap-2 px-6 py-4 bg-primary text-white rounded-xl font-bold hover:bg-primary-content transition-all shadow-lg shadow-primary/30"
                >
                  <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M9 3.75H6.912a2.25 2.25 0 0 0-2.15 1.588L2.35 13.177a2.25 2.25 0 0 0-.1.661V18a2.25 2.25 0 0 0 2.25 2.25h15A2.25 2.25 0 0 0 21.75 18v-4.162c0-.224-.034-.447-.1-.661L19.24 5.338a2.25 2.25 0 0 0-2.15-1.588H15M2.25 13.5h3.86a2.25 2.25 0 0 1 2.012 1.244l.256.512a2.25 2.25 0 0 0 2.013 1.244h3.218a2.25 2.25 0 0 0 2.013-1.244l.256-.512a2.25 2.25 0 0 1 2.013-1.244h3.859M12 3v8.25m0 0-3-3m3 3 3-3" />
                  </svg>
                  Update Booking
                </button>
                <button
                  id="cancelBookingBtn"
                  class="flex-1 flex items-center justify-center gap-2 px-6 py-4 bg-white dark:bg-surface-dark border-2 border-red-200 dark:border-red-900/30 text-red-500 rounded-xl font-bold hover:bg-red-50 dark:hover:bg-red-900/10 transition-all"
                >
                  <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="m9.75 9.75 4.5 4.5m0-4.5-4.5 4.5M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0Z" />
                  </svg>
                  Cancel Appointment
                </button>
              </div>
            </div>

          </div>
          <div class="h-10"></div>
        </div>
      </main>
    </div>

    <!-- Scripts -->
    <script src="../assets/js/common.js"></script>
    <script src="../assets/js/admin/booking-details.js"></script>
  </body>
</html>
