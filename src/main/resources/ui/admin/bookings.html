<!doctype html>
<html class="light" lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Manage Bookings - Pawradise Spa</title>
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com" rel="preconnect" />
  <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect" />
  <link
    href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  />
  <!-- CSS Files -->
  <link rel="stylesheet" href="../assets/css/output.css" />
  <link rel="stylesheet" href="../assets/css/styles.css" />
  <link rel="stylesheet" href="../assets/css/admin-dashboard.css" />
  <style>
    .calendar-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
    }
    .calendar-day {
      min-height: 120px;
    }
  </style>
</head>
<body
    class="bg-background-light dark:bg-background-dark text-text-main dark:text-white transition-colors duration-200"
  >
    <div class="flex h-screen w-full overflow-hidden">

      <!-- Sidebar (loaded dynamically) -->
      <aside
        id="sidebar"
        class="w-64 flex-shrink-0 border-r border-slate-200 dark:border-gray-800 bg-white dark:bg-surface-dark flex flex-col h-full z-20 transition-all duration-300"
      ></aside>
      <!-- Main Content -->
      <main
        class="flex-1 flex flex-col h-full overflow-hidden bg-background-light dark:bg-background-dark relative"
      >
        <!-- Header (loaded dynamically) -->
        <header
          id="header"
          class="flex-shrink-0 h-20 bg-white/80 dark:bg-surface-dark/80 backdrop-blur-md border-b border-slate-200 dark:border-gray-800 flex items-center justify-between px-8 z-10 sticky top-0"
        ></header>
        <!-- Page Content -->
        <div class="flex-1 overflow-y-auto p-8 scroll-smooth">
          <div class="max-w-[1400px] mx-auto flex flex-col gap-6">

            <!-- Page Header -->
            <div class="flex flex-col md:flex-row justify-between items-start md:items-end gap-4">
              <div>
                <h1 class="text-3xl font-bold text-text-main dark:text-white tracking-tight">
                  Manage Bookings
                </h1>
                <p class="text-text-muted mt-1 font-medium">
                  Unified calendar view for all staff and services.
                </p>
              </div>
              <div class="flex gap-3">
                <button
                  id="newBookingBtn"
                  class="flex items-center gap-2 px-5 py-2.5 bg-primary text-white rounded-xl font-semibold text-sm hover:bg-primary-content transition-colors shadow-lg shadow-primary/30"
                >
                  <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15" />
                  </svg>
                  New Booking
                </button>
              </div>
            </div>
            <!-- Calendar Card -->
            <div class="bg-surface-light dark:bg-surface-dark rounded-2xl shadow-card border border-slate-200/50 dark:border-gray-800 overflow-hidden">

              <!-- Calendar Controls -->
              <div class="p-6 border-b border-slate-200 dark:border-gray-800 flex items-center justify-between">
                <div class="flex items-center gap-4">
                  <div class="flex items-center bg-slate-100 dark:bg-gray-800/50 rounded-xl p-1">
                    <button
                      id="prevMonthBtn"
                      class="p-1.5 text-text-muted hover:text-primary transition-colors flex items-center justify-center"
                    >
                      <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 19.5 8.25 12l7.5-7.5" />
                      </svg>
                    </button>
                    <h2
                      id="currentMonth"
                      class="px-4 text-lg font-bold text-text-main dark:text-white min-w-[160px] text-center"
                    >Loading...</h2>
                    <button
                      id="nextMonthBtn"
                      class="p-1.5 text-text-muted hover:text-primary transition-colors flex items-center justify-center"
                    >
                      <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round" d="m8.25 4.5 7.5 7.5-7.5 7.5" />
                      </svg>
                    </button>
                  </div>
                  <button
                    id="todayBtn"
                    class="px-5 py-2.5 border border-slate-200 dark:border-gray-700 rounded-xl text-sm font-semibold text-text-main dark:text-white hover:bg-slate-50 dark:hover:bg-gray-800 transition-all"
                  >
                    Today
                  </button>
                </div>
              </div>
              <!-- Day-of-week Header -->
              <div class="calendar-grid bg-slate-50 dark:bg-gray-800/30 border-b border-slate-200 dark:border-gray-800">
                <div class="py-3 text-center text-xs font-bold text-text-muted uppercase tracking-wider border-r border-slate-200/50 dark:border-gray-800/50">Sun</div>
                <div class="py-3 text-center text-xs font-bold text-text-muted uppercase tracking-wider border-r border-slate-200/50 dark:border-gray-800/50">Mon</div>
                <div class="py-3 text-center text-xs font-bold text-text-muted uppercase tracking-wider border-r border-slate-200/50 dark:border-gray-800/50">Tue</div>
                <div class="py-3 text-center text-xs font-bold text-text-muted uppercase tracking-wider border-r border-slate-200/50 dark:border-gray-800/50">Wed</div>
                <div class="py-3 text-center text-xs font-bold text-text-muted uppercase tracking-wider border-r border-slate-200/50 dark:border-gray-800/50">Thu</div>
                <div class="py-3 text-center text-xs font-bold text-text-muted uppercase tracking-wider border-r border-slate-200/50 dark:border-gray-800/50">Fri</div>
                <div class="py-3 text-center text-xs font-bold text-text-muted uppercase tracking-wider">Sat</div>
              </div>
              <!-- Calendar Days (rendered by JS) -->
              <div
                id="calendarGrid"
                class="calendar-grid divide-x divide-y divide-slate-200 dark:divide-gray-800"
              ></div>

            </div>
          </div>
          <div class="h-10"></div>
        </div>
      </main>
    </div>

    <!-- Modal Container (required by common.js openModal) -->
    <div id="modalContainer" class="hidden fixed inset-0 z-50 flex items-center justify-center p-4">
      <div class="absolute inset-0 bg-black/40 backdrop-blur-sm" onclick="closeModal()"></div>
      <div class="relative bg-white dark:bg-surface-dark rounded-2xl shadow-2xl w-full max-w-lg max-h-[90vh] overflow-y-auto">
        <div class="flex items-center justify-between p-6 border-b border-slate-200 dark:border-gray-800">
          <h3 id="modalTitle" class="text-lg font-bold text-text-main dark:text-white"></h3>
          <button onclick="closeModal()" class="size-8 flex items-center justify-center rounded-full hover:bg-slate-100 dark:hover:bg-gray-800 transition-colors text-text-muted">
            <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18 18 6M6 6l12 12"/></svg>
          </button>
        </div>
        <div id="modalBody" class="p-6"></div>
      </div>
    </div>

    <!-- Scripts -->
    <script src="../assets/js/common.js"></script>
    <script src="../assets/js/admin/bookings.js"></script>
  </body>
</html>
