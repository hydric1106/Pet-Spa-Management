<!doctype html>
<html class="light" lang="en">
  <head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Manage Clients - Pawradise Spa</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com" rel="preconnect" />
    <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect" />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <!-- CSS Files -->
    <link rel="stylesheet" href="../assets/css/output.css" />
    <link rel="stylesheet" href="../assets/css/styles.css" />
    <link rel="stylesheet" href="../assets/css/admin-dashboard.css" />
  </head>
  <body
    class="bg-background-light dark:bg-background-dark text-text-main dark:text-white transition-colors duration-200"
  >
    <div class="flex h-screen w-full overflow-hidden">

      <!-- Sidebar (loaded dynamically) -->
      <aside
        id="sidebar"
        class="w-64 flex-shrink-0 border-r border-slate-200 dark:border-gray-800 bg-white dark:bg-surface-dark flex flex-col h-full z-20 transition-all duration-300"
      ></aside>

      <!-- Main Content -->
      <main
        class="flex-1 flex flex-col h-full overflow-hidden bg-background-light dark:bg-background-dark relative"
      >
        <!-- Header (loaded dynamically) -->
        <header
          id="header"
          class="flex-shrink-0 h-20 bg-white/80 dark:bg-surface-dark/80 backdrop-blur-md border-b border-slate-200 dark:border-gray-800 flex items-center justify-between px-8 z-10 sticky top-0"
        ></header>

        <!-- Page Content -->
        <div class="flex-1 overflow-y-auto p-8 scroll-smooth">
          <div class="max-w-[1400px] mx-auto flex flex-col gap-8">

            <!-- Page Header -->
            <div class="flex flex-col md:flex-row justify-between items-start md:items-end gap-4">
              <div>
                <h1 class="text-3xl font-bold text-text-main dark:text-white tracking-tight">
                  Manage Clients
                </h1>
                <p class="text-text-muted mt-1 font-medium">
                  View and manage your pet spa client roster.
                </p>
              </div>
              <div class="flex gap-3">
                <button
                  id="registerClientBtn"
                  class="flex items-center gap-2 px-5 py-2.5 bg-primary text-white rounded-xl font-semibold text-sm hover:bg-primary-content transition-colors shadow-lg shadow-primary/30"
                >
                  <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15" />
                  </svg>
                  Register New Client
                </button>
              </div>
            </div>

            <!-- Total Count -->
            <div class="flex items-center justify-between mb-[-24px]">
              <div
                id="totalClientsCount"
                class="text-sm font-semibold text-text-muted bg-surface-light dark:bg-surface-dark px-4 py-2 rounded-lg border border-slate-200/50 dark:border-gray-800"
              >
                Total Clients: 0
              </div>
            </div>

            <!-- Clients Table -->
            <div class="bg-surface-light dark:bg-surface-dark rounded-2xl shadow-card border border-slate-200/50 dark:border-gray-800 overflow-hidden">
              <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                  <thead>
                    <tr class="text-text-muted text-[11px] uppercase tracking-wider bg-slate-50/80 dark:bg-gray-800/40 border-b border-slate-100 dark:border-gray-800">
                      <th class="px-6 py-4 font-bold">Client Name</th>
                      <th class="px-6 py-4 font-bold">Phone &amp; Email</th>
                      <th class="px-6 py-4 font-bold">Address</th>
                      <th class="px-6 py-4 font-bold">Pets Owned</th>
                      <th class="px-6 py-4 font-bold text-right">Actions</th>
                    </tr>
                  </thead>
                  <tbody id="clientsTableBody" class="divide-y divide-slate-100 dark:divide-gray-800">
                    <!-- Rows injected by JS -->
                  </tbody>
                </table>
              </div>

              <!-- Empty State -->
              <div id="emptyState" class="hidden py-20 flex flex-col items-center justify-center text-center">
                <div class="size-16 rounded-full bg-slate-100 dark:bg-gray-800 flex items-center justify-center mb-4">
                  <svg class="w-8 h-8 text-text-muted" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M15 19.128a9.38 9.38 0 0 0 2.625.372 9.337 9.337 0 0 0 4.121-.952 4.125 4.125 0 0 0-7.533-2.493M15 19.128v-.003c0-1.113-.285-2.16-.786-3.07M15 19.128v.106A12.318 12.318 0 0 1 8.624 21c-2.331 0-4.512-.645-6.374-1.766l-.001-.109a6.375 6.375 0 0 1 11.964-3.07M12 6.375a3.375 3.375 0 1 1-6.75 0 3.375 3.375 0 0 1 6.75 0Zm8.25 2.25a2.625 2.625 0 1 1-5.25 0 2.625 2.625 0 0 1 5.25 0Z" />
                  </svg>
                </div>
                <p class="text-text-muted font-semibold text-sm">No clients registered yet.</p>
                <p class="text-text-muted/70 text-xs mt-1">Click "Register New Client" to get started.</p>
              </div>

              <!-- Pagination Bar -->
              <div id="paginationBar" class="hidden px-6 py-4 border-t border-slate-100 dark:border-gray-800 flex flex-col sm:flex-row items-center justify-between gap-3">
                <p id="pageInfo" class="text-sm text-text-muted font-medium"></p>
                <div class="flex items-center gap-2">
                  <button
                    id="prevPageBtn"
                    class="size-9 flex items-center justify-center rounded-full border border-slate-200 dark:border-gray-700 text-text-muted hover:bg-slate-50 dark:hover:bg-gray-800 transition-colors disabled:opacity-40 disabled:cursor-not-allowed"
                  >
                    <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                      <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 19.5 8.25 12l7.5-7.5" />
                    </svg>
                  </button>
                  <div id="pageNumbers" class="flex gap-1"></div>
                  <button
                    id="nextPageBtn"
                    class="size-9 flex items-center justify-center rounded-full border border-slate-200 dark:border-gray-700 text-text-muted hover:bg-slate-50 dark:hover:bg-gray-800 transition-colors disabled:opacity-40 disabled:cursor-not-allowed"
                  >
                    <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                      <path stroke-linecap="round" stroke-linejoin="round" d="m8.25 4.5 7.5 7.5-7.5 7.5" />
                    </svg>
                  </button>
                </div>
              </div>
            </div>

          </div>
          <div class="h-10"></div>
        </div>
      </main>
    </div>

    <!-- Client Modal -->
    <div
      id="clientModal"
      class="hidden fixed inset-0 z-50 flex items-center justify-center bg-black/40 backdrop-blur-sm p-4"
    >
      <div class="bg-white dark:bg-surface-dark rounded-2xl shadow-2xl w-full max-w-lg border border-slate-200 dark:border-gray-700">
        <!-- Modal Header -->
        <div class="flex items-center justify-between px-6 py-5 border-b border-slate-100 dark:border-gray-800">
          <h2 id="clientModalTitle" class="text-lg font-bold text-text-main dark:text-white">Register New Client</h2>
          <button
            id="closeModalBtn"
            class="size-9 flex items-center justify-center rounded-full text-text-muted hover:bg-slate-100 dark:hover:bg-gray-800 transition-colors"
          >
            <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M6 18 18 6M6 6l12 12" />
            </svg>
          </button>
        </div>

        <!-- Modal Body -->
        <form id="clientForm" class="px-6 py-5 flex flex-col gap-4">
          <input type="hidden" id="clientId" />

          <!-- Full Name -->
          <div class="flex flex-col gap-1.5">
            <label class="text-sm font-semibold text-text-main dark:text-white" for="clientFullName">
              Full Name <span class="text-red-500">*</span>
            </label>
            <input
              id="clientFullName"
              type="text"
              required
              placeholder="e.g. Jane Doe"
              class="px-4 py-2.5 rounded-xl border border-slate-200 dark:border-gray-700 bg-slate-50 dark:bg-gray-800 text-sm text-text-main dark:text-white placeholder:text-text-muted/60 focus:outline-none focus:ring-2 focus:ring-primary/30 focus:border-primary transition"
            />
          </div>

          <!-- Phone Number -->
          <div class="flex flex-col gap-1.5">
            <label class="text-sm font-semibold text-text-main dark:text-white" for="clientPhone">
              Phone Number <span class="text-red-500">*</span>
            </label>
            <input
              id="clientPhone"
              type="tel"
              required
              placeholder="e.g. +1 234-567-8901"
              class="px-4 py-2.5 rounded-xl border border-slate-200 dark:border-gray-700 bg-slate-50 dark:bg-gray-800 text-sm text-text-main dark:text-white placeholder:text-text-muted/60 focus:outline-none focus:ring-2 focus:ring-primary/30 focus:border-primary transition"
            />
          </div>

          <!-- Email -->
          <div class="flex flex-col gap-1.5">
            <label class="text-sm font-semibold text-text-main dark:text-white" for="clientEmail">
              Email Address
            </label>
            <input
              id="clientEmail"
              type="email"
              placeholder="e.g. jane@email.com"
              class="px-4 py-2.5 rounded-xl border border-slate-200 dark:border-gray-700 bg-slate-50 dark:bg-gray-800 text-sm text-text-main dark:text-white placeholder:text-text-muted/60 focus:outline-none focus:ring-2 focus:ring-primary/30 focus:border-primary transition"
            />
          </div>

          <!-- Address -->
          <div class="flex flex-col gap-1.5">
            <label class="text-sm font-semibold text-text-main dark:text-white" for="clientAddress">
              Address
            </label>
            <input
              id="clientAddress"
              type="text"
              placeholder="e.g. 123 Main St, Springfield"
              class="px-4 py-2.5 rounded-xl border border-slate-200 dark:border-gray-700 bg-slate-50 dark:bg-gray-800 text-sm text-text-main dark:text-white placeholder:text-text-muted/60 focus:outline-none focus:ring-2 focus:ring-primary/30 focus:border-primary transition"
            />
          </div>

          <!-- Modal Footer -->
          <div class="flex justify-end gap-3 pt-2">
            <button
              id="cancelModalBtn"
              type="button"
              class="px-5 py-2.5 rounded-xl border border-slate-200 dark:border-gray-700 text-sm font-semibold text-text-muted hover:bg-slate-50 dark:hover:bg-gray-800 transition-colors"
            >
              Cancel
            </button>
            <button
              type="submit"
              class="px-5 py-2.5 rounded-xl bg-primary text-white text-sm font-semibold hover:bg-primary-content transition-colors shadow-md shadow-primary/20"
            >
              Save Client
            </button>
          </div>
        </form>
      </div>
    </div>

    <!-- Scripts -->
    <script src="../assets/js/common.js"></script>
    <script src="../assets/js/admin/clients.js"></script>
  </body>
</html>
