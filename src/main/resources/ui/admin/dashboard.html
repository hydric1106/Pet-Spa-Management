<!doctype html>
<html class="light" lang="en">
  <head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Admin Dashboard</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com" rel="preconnect" />
    <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect" />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&amp;display=swap"
      rel="stylesheet"
    />
    <!-- CSS Files -->
    <link rel="stylesheet" href="../assets/css/output.css" />
    <link rel="stylesheet" href="../assets/css/styles.css" />
    <link rel="stylesheet" href="../assets/css/admin-dashboard.css" />
  </head>
  <body
    class="bg-background-light dark:bg-background-dark text-text-main dark:text-white transition-colors duration-200"
  >
    <div class="flex h-screen w-full overflow-hidden">
      <!-- Sidebar (loaded dynamically) -->
      <aside
        id="sidebar"
        class="w-64 flex-shrink-0 border-r border-slate-200 dark:border-gray-800 bg-white dark:bg-surface-dark flex flex-col h-full z-20 transition-all duration-300"
      ></aside>

      <!-- Main Content -->
      <main
        class="flex-1 flex flex-col h-full overflow-hidden bg-background-light dark:bg-background-dark relative"
      >
        <!-- Header (loaded dynamically) -->
        <header
          id="header"
          class="flex-shrink-0 h-20 bg-white/80 dark:bg-surface-dark/80 backdrop-blur-md border-b border-slate-200 dark:border-gray-800 flex items-center justify-between px-8 z-10 sticky top-0"
        ></header>

        <!-- Page Content -->
        <div class="flex-1 overflow-y-auto p-8 scroll-smooth">
          <div class="max-w-[1400px] mx-auto flex flex-col gap-8 pb-8">
            <div>
              <h1
                class="text-3xl font-bold text-text-main dark:text-white tracking-tight"
              >
                Good Morning, <span id="welcomeUserName">there</span>!
              </h1>
              <p class="text-text-muted mt-1 font-medium">
                Here's what's happening at the spa today.
              </p>
              <div class="flex flex-wrap items-center gap-3 mt-4">
                <div
                  class="flex items-center gap-3 px-4 py-2 bg-surface-light dark:bg-surface-dark rounded-xl border border-slate-200 dark:border-gray-700 text-sm font-semibold text-text-main dark:text-white shadow-sm"
                >
                  <span
                    class="text-xs font-bold uppercase tracking-widest text-text-muted"
                    >Today's Appointments</span
                  >
                  <span id="todayBookings" class="text-base font-bold">0</span>
                </div>
                <div
                  class="flex items-center gap-3 px-4 py-2 bg-surface-light dark:bg-surface-dark rounded-xl border border-slate-200 dark:border-gray-700 text-sm font-semibold text-text-main dark:text-white shadow-sm"
                >
                  <span
                    class="text-xs font-bold uppercase tracking-widest text-text-muted"
                    >Active Staff</span
                  >
                  <span id="activeStaff" class="text-base font-bold">0</span>
                </div>
                <div
                  class="flex items-center gap-3 px-4 py-2 bg-surface-light dark:bg-surface-dark rounded-xl border border-slate-200 dark:border-gray-700 text-sm font-semibold text-text-main dark:text-white shadow-sm"
                >
                  <span
                    class="text-xs font-bold uppercase tracking-widest text-text-muted"
                    >Total Clients</span
                  >
                  <span id="totalCustomers" class="text-base font-bold">0</span>
                </div>
                <div
                  class="flex items-center gap-3 px-4 py-2 bg-emerald-50 dark:bg-emerald-900/20 text-emerald-700 dark:text-emerald-400 rounded-xl border border-emerald-100 dark:border-emerald-800 text-sm font-semibold shadow-sm"
                >
                  <span class="text-xs font-bold uppercase tracking-widest"
                    >Daily Revenue</span
                  >
                  <span id="combinedRevenueToday" class="text-base font-bold"
                    >0</span
                  >
                </div>
              </div>
            </div>

            <div
              class="bg-surface-light dark:bg-surface-dark p-8 rounded-2xl shadow-card border border-transparent hover:border-slate-200 dark:hover:border-gray-700 transition-all flex flex-col gap-6"
            >
              <div
                class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4"
              >
                <div class="flex flex-wrap items-center gap-3">
                  <h2 class="text-xl font-bold text-text-main dark:text-white">
                    Revenue Growth
                  </h2>
                  <div
                    class="flex items-center gap-2 px-3 py-1 rounded-full bg-slate-100 dark:bg-gray-800 text-xs font-semibold text-text-muted dark:text-gray-300"
                  >
                    <span>Total:</span>
                    <span id="revenueChartTotal" class="text-text-main dark:text-white">--</span>
                  </div>
                </div>
                <div
                  class="flex items-center bg-slate-100 dark:bg-gray-800 p-1 rounded-xl"
                >
                  <button
                    class="revenue-range-btn px-4 py-1.5 rounded-lg text-sm font-semibold text-text-muted hover:text-text-main dark:text-gray-300 dark:hover:text-white transition-colors"
                    data-revenue-range="week"
                    type="button"
                    aria-pressed="false"
                  >
                    This Week
                  </button>
                  <button
                    class="revenue-range-btn px-4 py-1.5 rounded-lg text-sm font-semibold text-text-muted hover:text-text-main dark:text-gray-300 dark:hover:text-white transition-colors"
                    data-revenue-range="month"
                    type="button"
                    aria-pressed="false"
                  >
                    This Month
                  </button>
                  <button
                    class="revenue-range-btn px-4 py-1.5 rounded-lg text-sm font-semibold text-text-muted hover:text-text-main dark:text-gray-300 dark:hover:text-white transition-colors"
                    data-revenue-range="year"
                    type="button"
                    aria-pressed="false"
                  >
                    This Year
                  </button>
                </div>
              </div>

              <div
                class="rounded-2xl border border-slate-200 dark:border-gray-700 bg-white/80 dark:bg-surface-dark/80 p-4"
              >
                <div class="relative">
                  <svg
                    id="revenueChartSvg"
                    viewBox="0 0 640 240"
                    class="w-full text-primary"
                    style="height: clamp(260px, 40vh, 440px);"
                    role="img"
                    aria-label="Revenue chart"
                  >
                    <defs>
                      <linearGradient
                        id="revenueChartGradient"
                        x1="0"
                        y1="0"
                        x2="0"
                        y2="1"
                      >
                        <stop
                          offset="0%"
                          stop-color="#13daec"
                          stop-opacity="0.35"
                        ></stop>
                        <stop
                          offset="100%"
                          stop-color="#13daec"
                          stop-opacity="0"
                        ></stop>
                      </linearGradient>
                    </defs>
                    <g id="revenueChartGrid"></g>
                    <path id="revenueChartArea" fill="url(#revenueChartGradient)" d=""></path>
                    <g id="revenueChartXAxis"></g>
                    <g id="revenueChartValueLabels"></g>
                    <path
                      id="revenueChartLine"
                      fill="none"
                      stroke="currentColor"
                      stroke-width="3"
                      stroke-linecap="round"
                      stroke-linejoin="round"
                      d=""
                    ></path>
                    <g id="revenueChartDots"></g>
                  </svg>
                  <div
                    id="revenueChartEmpty"
                    class="absolute inset-0 hidden items-center justify-center text-sm font-semibold text-text-muted"
                  >
                    No revenue data for this range yet.
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </main>
    </div>

    <!-- JavaScript -->
    <script src="../assets/js/common.js"></script>
    <script src="../assets/js/admin/dashboard.js"></script>
  </body>
</html>
